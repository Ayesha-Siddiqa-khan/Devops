name: Boutique E-Commerce CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  PROJECT_DIR: boutique e-commerce/boutique-ecommerce

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - image: frontend-service
            context: ./boutique e-commerce/boutique-ecommerce/frontend
            dockerfile: ./boutique e-commerce/boutique-ecommerce/frontend/Dockerfile

          - image: api-gateway
            context: ./boutique e-commerce/boutique-ecommerce/api-gateway
            dockerfile: ./boutique e-commerce/boutique-ecommerce/api-gateway/Dockerfile

          - image: auth-service
            context: ./boutique e-commerce/boutique-ecommerce/auth-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/auth-service/Dockerfile

          - image: product-service
            context: ./boutique e-commerce/boutique-ecommerce/product-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/product-service/Dockerfile

          - image: cart-service
            context: ./boutique e-commerce/boutique-ecommerce/cart-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/cart-service/Dockerfile

          - image: order-service
            context: ./boutique e-commerce/boutique-ecommerce/order-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/order-service/Dockerfile

          - image: user-service
            context: ./boutique e-commerce/boutique-ecommerce/user-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/user-service/Dockerfile

          - image: payment-service
            context: ./boutique e-commerce/boutique-ecommerce/payment-service
            dockerfile: ./boutique e-commerce/boutique-ecommerce/payment-service/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}

  deploy:
    name: Deploy to Local Minikube
    runs-on: [self-hosted, Windows, X64]
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Runner Name
        run: hostname

      - name: Check Minikube Context
        run: kubectl config current-context

      - name: Check Kubernetes Nodes
        run: kubectl get nodes

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f "$env:PROJECT_DIR/k8s/"

      - name: Restart Deployments
        run: |
          kubectl rollout restart deployment frontend-service -n boutique-app
          kubectl rollout restart deployment api-gateway-service -n boutique-app
          kubectl rollout restart deployment auth-service -n boutique-app
          kubectl rollout restart deployment product-service -n boutique-app
          kubectl rollout restart deployment cart-service -n boutique-app
          kubectl rollout restart deployment order-service -n boutique-app
          kubectl rollout restart deployment user-service -n boutique-app
          kubectl rollout restart deployment payment-service -n boutique-app

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/frontend-service -n boutique-app
          kubectl rollout status deployment/api-gateway-service -n boutique-app
          kubectl rollout status deployment/auth-service -n boutique-app
          kubectl rollout status deployment/product-service -n boutique-app
          kubectl rollout status deployment/cart-service -n boutique-app
          kubectl rollout status deployment/order-service -n boutique-app
          kubectl rollout status deployment/user-service -n boutique-app
          kubectl rollout status deployment/payment-service -n boutique-app

      - name: Verify Pods
        run: kubectl get pods -n boutique-app

      - name: Verify Services
        run: kubectl get svc -n boutique-app
