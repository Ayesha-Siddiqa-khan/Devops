name: Boutique E-Commerce CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - image: frontend-service
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - image: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile

          - image: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile

          - image: product-service
            context: ./product-service
            dockerfile: ./product-service/Dockerfile

          - image: cart-service
            context: ./cart-service
            dockerfile: ./cart-service/Dockerfile

          - image: order-service
            context: ./order-service
            dockerfile: ./order-service/Dockerfile

          - image: user-service
            context: ./user-service
            dockerfile: ./user-service/Dockerfile

          - image: payment-service
            context: ./payment-service
            dockerfile: ./payment-service/Dockerfile

    steps:
      - name: Checkout Code (SAFE MODE)
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}

  deploy:
    name: Deploy to Local Minikube
    runs-on: [self-hosted, Windows, X64]
    needs: build-and-push

    steps:
      - name: Checkout Code (CLEAN FIX)
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean Git State (IMPORTANT FIX)
        run: |
          git reset --hard
          git clean -fd

      - name: Show Runner Name
        run: hostname

      - name: Check Minikube Context
        run: kubectl config current-context

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Force Restart Deployments
        run: |
          kubectl rollout restart deployment -n boutique-app

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/frontend-service -n boutique-app
          kubectl rollout status deployment/api-gateway-service -n boutique-app

      - name: Verify Pods
        run: kubectl get pods -n boutique-app

      - name: Verify Services
        run: kubectl get svc -n boutique-app
